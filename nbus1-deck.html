<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N버스 STEP 1 발표 — 박종화 포트폴리오</title>
<meta name="description" content="N버스 STEP 1 발표 발표 슬라이드">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --bg: #0b0e13; --panel: #141922; --ink: #e9edf2; --sub: #9aa4b1; --line: #252c37; --accent: #4c8dff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Pretendard, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  header h1 small { color: var(--sub); font-weight: 500; margin-left: 8px; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .links a { color: var(--ink); text-decoration: none; font-size: 13px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); white-space: nowrap; }
  .links a:hover { border-color: var(--accent); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; }
  .stage { position: relative; width: min(100%, calc((100vh - 170px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.45); touch-action: pan-y; user-select: none; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .nav { position: absolute; top: 0; bottom: 0; width: 22%; border: 0; background: transparent; cursor: pointer; color: transparent; }
  .nav.prev { left: 0; } .nav.next { right: 0; }
  .nav:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  footer { display: flex; align-items: center; gap: 14px; padding: 10px 20px 18px; }
  footer button { font: inherit; font-size: 14px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  footer button:disabled { opacity: .35; cursor: default; }
  .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .count { font-variant-numeric: tabular-nums; color: var(--sub); font-size: 13px; min-width: 64px; text-align: right; }
  .hint { color: var(--sub); font-size: 12px; text-align: center; padding: 0 20px 14px; }
  @media (max-width: 640px) { header { flex-direction: column; align-items: flex-start; } .hint { display: none; } }
</style>
</head>
<body>
<header>
  <h1>N버스 STEP 1 발표<small>N버스 정류장 승하차수 예측을 통한 취약지역 선정</small></h1>
  <nav class="links">
    <a href="./">← 포트폴리오</a>
  </nav>
</header>
<main>
  <div class="stage" id="stage">
    <img id="slide" src="images/nbus1-deck/001.jpg" alt="N버스 STEP 1 발표 1쪽">
    <button class="nav prev" id="tapPrev" type="button" aria-label="이전 슬라이드">이전</button>
    <button class="nav next" id="tapNext" type="button" aria-label="다음 슬라이드">다음</button>
  </div>
</main>
<footer>
  <button id="prev" type="button" aria-label="이전 슬라이드">←</button>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <span class="count" id="count" aria-live="polite">1 / 24</span>
  <button id="next" type="button" aria-label="다음 슬라이드">→</button>
</footer>
<p class="hint">← → 키, 화면 좌우 클릭, 또는 밀어서 넘깁니다.</p>
<script>
(() => {
  const N = 24;
  const src = i => `images/nbus1-deck/${String(i).padStart(3, '0')}.jpg`;
  const img = document.getElementById('slide');
  const count = document.getElementById('count');
  const bar = document.getElementById('bar');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const cache = new Map();
  const preload = i => { if (i < 1 || i > N || cache.has(i)) return; const p = new Image(); p.src = src(i); cache.set(i, p); };
  const fromHash = () => { const n = parseInt(location.hash.slice(1), 10); return n >= 1 && n <= N ? n : 1; };
  let cur = fromHash();
  const show = i => {
    cur = Math.min(N, Math.max(1, i));
    img.src = src(cur);
    img.alt = `N버스 STEP 1 발표 ${cur}쪽`;
    count.textContent = `${cur} / ${N}`;
    bar.style.width = `${(cur / N) * 100}%`;
    prevBtn.disabled = cur === 1;
    nextBtn.disabled = cur === N;
    history.replaceState(null, '', `#${cur}`);
    preload(cur + 1); preload(cur + 2); preload(cur - 1);
  };
  prevBtn.onclick = document.getElementById('tapPrev').onclick = () => show(cur - 1);
  nextBtn.onclick = document.getElementById('tapNext').onclick = () => show(cur + 1);
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); show(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (e.key === 'Home') show(1);
    else if (e.key === 'End') show(N);
  });
  let x0 = null;
  const stage = document.getElementById('stage');
  stage.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) show(cur + (dx < 0 ? 1 : -1));
  });
  addEventListener('hashchange', () => show(fromHash()));
  show(cur);
})();
</script>
</body>
</html>
